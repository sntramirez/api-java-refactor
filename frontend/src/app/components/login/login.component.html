<div class="login-container">
  <div class="login-card">
    <h1>Iniciar Sesión</h1>

    <!-- Selector de Tipo de Usuario -->
    <div class="tabs">
      <button
        class="tab"
        [class.active]="tipoUsuario === 'BENEFICIARIO'"
        (click)="seleccionarTipo('BENEFICIARIO')">
        Beneficiario
      </button>
      <button
        class="tab"
        [class.active]="tipoUsuario === 'ADMINISTRADOR'"
        (click)="seleccionarTipo('ADMINISTRADOR')">
        Administrador
      </button>
    </div>

    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">
          {{ tipoUsuario === 'BENEFICIARIO' ? 'Email o Cédula' : 'Email' }}
        </label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="form-control"
          placeholder="Ingresa tu identificación">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Ingresa tu contraseña">
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="recordarme">
          <span>Recordarme</span>
        </label>

        <a class="link" (click)="olvidoPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="!loginForm.valid || loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <div *ngIf="tipoUsuario === 'BENEFICIARIO'" class="registro-link">
        <p>
          ¿No tienes cuenta?
          <a class="link" (click)="irARegistro()">Regístrate como beneficiario</a>
        </p>
      </div>
    </form>
  </div>
</div>
